
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        patient_provider:
            entity:
                class: App\Auth\Register\Client\Entity\UserAccount
                property: email

        admin_provider:
            entity:
                class: App\Auth\Register\Admin\Entity\AdminAccount
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        patient_login:
            pattern: ^/api/patient/login$
            stateless: true
            provider: patient_provider
            json_login:
                check_path: /api/patient/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        admin_login:
            pattern: ^/api/admin/login$
            stateless: true
            provider: admin_provider
            json_login:
                check_path: /api/admin/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            provider: patient_provider
            jwt: ~

    access_control:
        # Connexions publiques
        - { path: ^/api/patient/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/medical-records, roles: PUBLIC_ACCESS }
        - { path: ^/api/medical-records/patient, roles: PUBLIC_ACCESS }

        # Inscriptions publiques
        - { path: ^/api/patient/create$, roles: PUBLIC_ACCESS }

        # Autres routes publiques : adapte aux routes réelles
        - { path: ^/api/doctors/all$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/doctors/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/specialties$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^api/prescriptions$, roles: PUBLIC_ACCESS, methods: [POST] }

        # Profil patient
        - { path: ^/api/patients/profile$, roles: ROLE_PATIENT }

        # Espace administrateur
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Tout le reste de l'API nécessite une authentification
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
